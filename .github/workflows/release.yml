name: Release

# Ausloeser: ein Tag "v*" baut UND veroeffentlicht ein Release. "workflow_dispatch" baut denselben
# Lauf von Hand OHNE Tag - dann wird nur das ZIP als Workflow-Artefakt angehaengt, kein Release
# angelegt (Aufgabe 7, Schritt 2). So laesst sich der Bau pruefen, bevor eine Fassung tatsaechlich
# veroeffentlicht wird - der einzige Unterschied zwischen beiden Wegen steckt ganz unten in den
# beiden letzten Schritten.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# GITHUB_TOKEN braucht Schreibrechte, um bei einem Tag ein Release samt Anhaengen anzulegen
# ("gh release create" ganz unten); beim Probelauf (workflow_dispatch) wird davon nichts gebraucht.
permissions:
  contents: write

jobs:
  release:
    # Nur windows-latest: jpackage baut immer nur fuer die gerade laufende Plattform, und dieses
    # Projekt liefert bisher ausschliesslich ein Windows-Paket (Spec 2026-09-26-app-paket-design.md §10).
    runs-on: windows-latest
    # scripts/package.sh und scripts/trim-res.sh sind fuer Git-Bash geschrieben und darunter erprobt
    # (siehe deren Kommentare) - ohne diese Vorgabe wuerde jeder "run"-Schritt sonst in PowerShell
    # laufen, wo z.B. das "$#" Alter Kommandozeilen-Pruefung des package.sh-Skripts nicht gilt.
    defaults:
      run:
        shell: bash
    steps:
      # ZIEL wird als SCHRITT gesetzt, nicht im env-Block der Aufgabe: der "runner"-Kontext steht
      # dort noch nicht zur Verfuegung ("Unrecognized named-value: 'runner'"), erst in Schritten.
      # "runner.temp" liefert auf windows-latest einen Windows-Laufwerkspfad (z.B. "D:\a\_temp"),
      # keinen Git-Bash-Pfad ("/d/a/_temp") - package.sh behandelt "<Buchstabe>:..." aber schon
      # selbst als absolut (siehe dessen Kommentar zu "ziel"), deshalb wird hier NICHT konvertiert.
      - name: Arbeitsverzeichnis festlegen
        run: echo "ZIEL=${{ runner.temp }}/paket" >> "$GITHUB_ENV"

      # Ohne das legt git unter Windows fuer "bridge/assets/res" einen echten Verweis auf
      # "../../forge/forge-gui/res" an. Dieser Verweis ist nur eine Bequemlichkeit fuer den Start aus
      # dem Quellbaum - der Paketbau liest Forges Daten direkt (package.sh ruft trim-res.sh mit
      # "forge/forge-gui/res" auf). Auf dem Laeufer ist er aber ein Stolperstein: jeder Schritt, der
      # den Arbeitsbereich durchsucht (z. B. der Maven-Zwischenspeicher ueber "**/pom.xml"), faellt
      # darueber mit "EPERM: operation not permitted, stat ...\bridge\assets\res". Mit
      # core.symlinks=false legt git stattdessen eine kleine Textdatei an, ueber die niemand stolpert.
      - name: Verweise unter Windows als Textdatei auschecken
        run: git config --global core.symlinks false

      - name: Auschecken (mit Forge-Submodul)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: JDK 17 (Temurin) einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # cache: maven cached ~/.m2/repository ueber einen Hash aller pom.xml im Checkout (Forge
          # UND bridge/) - ohne das laedt jeder Lauf Forges komplette Abhaengigkeiten neu herunter
          # und dauert unnoetig lange (Aufgabenstellung).
          cache: maven

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Forge bauen (installiert 2.0.14-mtgplayer nach ~/.m2, wie im README beschrieben)
        working-directory: forge
        run: mvn -q -pl forge-gui -am install -DskipTests -Dcheckstyle.skip -Dmaven.javadoc.skip=true

      - name: Web-UI bauen
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Schnelle Bridge-Einheitentests (Sicherheitsnetz vor dem Paketbau)
        working-directory: bridge
        run: |
          # Review-Befund, Punkt 12: scripts/package.sh baut die Bridge nur (mvn package -DskipTests)
          # und prueft nichts - ohne diesen Schritt koennte ein Tag ein Paket veroeffentlichen, das nie
          # gruen war. Die Auswahl war bis hierher namentlich geraten (Muster wie "!Bench*,!Sparring*")
          # und zog dabei ungewollt ~40 Tests mit, die ForgeBoot.init() aufrufen - das braucht Forges
          # Kartendaten unter bridge/assets/res, im Quellbaum nur ein VERWEIS auf forge/forge-gui/res.
          # Der wird hier bewusst als Textdatei ausgecheckt (siehe Schritt oben, core.symlinks=false) -
          # ohne das stuerzt jeder Schritt ab, der den Arbeitsbereich durchsucht (EPERM beim stat). Mit
          # dem Verweis als Textdatei findet ForgeBoot.init() aber keine echten Kartendaten mehr - beides
          # zusammen geht nicht, und "mehr Tests" verliert hier gegen "der Schritt laeuft ueberhaupt".
          #
          # Deshalb bewusst ENG: nur Testklassen, die (a) laut Quelltext KEIN ForgeBoot.init() aufrufen
          # UND auch sonst keine Forge-Klasse beruehren, deren statische Initialisierung selbst schon
          # Forges (dann fehlende) Ressourcen braucht - genau daran scheiterte hier zuerst StopsTest:
          # ruft kein ForgeBoot.init() auf, laedt aber ueber Stops.defaults() forge.game.phase.PhaseType,
          # dessen <clinit> Forges Localizer/Ressourcenbuendel voraussetzt (NoClassDefFoundError erst im
          # Testlauf sichtbar, nicht durch Lesen des Quelltexts allein) - und (b) auf Windows etwas
          # aussagen, das die volle Suite auf dem Entwicklungsrechner (Linux) nicht schon abdeckt - allen
          # voran die plattformnahen Dinge unter mtgplayer.app.* (Portwahl, Fassung, Update-Anwendung)
          # und CardStoreTest (genau der Windows-Fehler mit dem Doppelpunkt im Partie-Id-Dateinamen,
          # siehe CardStore). Die vollstaendige Suite (inkl. aller ForgeBoot-Tests, echter KI-Spiele,
          # End-to-End, Sparring, Bench) laeuft weiterhin auf dem Entwicklungsrechner.
          mvn -q -Dtest='AppModeTest,ArchidektTest,BenchStatsTest,BridgeImportErrorTextTest,CardLogTest,CardStoreTest,ChildJvmTest,ChoiceBrokerTest,CrashLogTest,EdhrecTest,ForgeBootDataDirTest,MatchRecordTest,MatchStoreTest,MessagesTest,SubprocessGameRunnerTest,ThinkingTickerTest,UpdateApplyTest,UpdateCheckTest,VersionTest,WsServerTest' test

      # Kein eigener "Bridge bauen"-Schritt hier: scripts/package.sh baut die Bridge (mvn package)
      # und sammelt ihre Abhaengigkeiten bereits selbst als ersten eigenen Schritt (siehe dessen
      # Kommentar "1. Bridge-Jar und Abhaengigkeiten sammeln") - ein zweiter Bau hier waere doppelte
      # Arbeit.

      - name: Fassung bestimmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Kein Tag vorhanden (Probelauf) - jpackage verlangt trotzdem eine rein numerische
            # Punktfassung fuer --app-version. Die fortlaufende Workflow-Lauf-Nummer haelt sie
            # eindeutig und zugleich klar erkennbar als "kein echtes Release".
            echo "value=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            # v1.2.0 -> 1.2.0: package.sh, version.txt und der Update-Weg (Version.isNewer) erwarten
            # die Fassung durchgehend ohne fuehrendes "v".
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Paket bauen (res ausduennen, jpackage-Abbild erzeugen)
        run: scripts/package.sh "${{ steps.version.outputs.value }}" "$ZIEL"

      - name: Fassung ins Jar-Manifest eintragen
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # package.sh selbst baut den Bridge-Jar per "mvn package" ohne die hier uebergebene
          # App-Fassung (der Dateiname traegt weiter bridge/pom.xml's eigene Maven-Version, siehe
          # package.sh-Kommentar dazu) - version.txt hat package.sh schon geschrieben, hier fehlt nur
          # noch das Jar-Manifest, das Version.java als zweite Quelle liest. "jar ufm" haengt
          # Implementation-Version nachtraeglich an den bereits im Paket-Abbild liegenden Jar an,
          # ohne package.sh selbst anzufassen oder neu zu bauen (das app-image steht schon).
          jar_pfad="$(find "$ZIEL/image/MTG-Player/app" -maxdepth 1 -name 'bridge-*.jar' \
              ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          if [ -z "$jar_pfad" ]; then
            echo "release.yml: kein bridge-*.jar unter $ZIEL/image/MTG-Player/app gefunden" >&2
            exit 1
          fi
          printf 'Implementation-Version: %s\n' "$VERSION" > "$RUNNER_TEMP/manifest-zusatz.txt"
          jar ufm "$jar_pfad" "$RUNNER_TEMP/manifest-zusatz.txt"

      - name: ZIP packen (genau ein oberster Ordner, siehe UpdateApply.singleTopLevelDir)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Review-Befund, Blocker 2 (kritisch): Compress-Archive (PowerShell) schreibt Eintragsnamen
          # bekanntermassen mit Backslash statt Schraegstrich - UpdateApply.validateEntryName lehnt
          # JEDEN Eintrag mit Backslash ab (Zip-Slip-Schutz, siehe dessen Kommentar). Von Hand entpacken
          # klappte trotzdem (Windows Explorer ist da grosszuegig), aber JEDES Selbst-Update schlug beim
          # Nutzer fehl. "jar -cMf" (kommt mit dem oben eingerichteten JDK, -M ohne Manifest - den
          # braucht ein reines Auslieferungs-ZIP nicht) schreibt Eintragsnamen zuverlaessig mit
          # Schraegstrich, wie jedes andere Java-Zip-Werkzeug auch.
          zipName="MTG-Player-$VERSION-win.zip"
          zipPath="$ZIEL/$zipName"
          (cd "$ZIEL/image" && jar -cMf "$zipPath" MTG-Player)
          echo "ZIP_PATH=$zipPath" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$zipName" >> "$GITHUB_ENV"

      - name: ZIP-Vertrag pruefen (nur Schraegstriche, genau ein oberster Ordner)
        run: |
          # Maschinell festgenagelt statt nur im Kommentar (Review-Befund, Blocker 2): der Bau bricht
          # ab, wenn doch ein Eintragsname einen Backslash enthaelt (UpdateApply.validateEntryName lehnt
          # das beim Update ab) oder oben nicht genau ein Ordner liegt (UpdateApply.singleTopLevelDir
          # verlangt das) - damit ist der Vertrag zwischen Bau und Update pruefbar, nicht nur behauptet.
          entries="$(jar -tf "$ZIP_PATH")"
          if echo "$entries" | grep -q '\\'; then
            echo "release.yml: ZIP-Eintrag mit Backslash gefunden - das Update wuerde beim Nutzer fehlschlagen:" >&2
            echo "$entries" | grep '\\' >&2
            exit 1
          fi
          topLevel="$(echo "$entries" | cut -d/ -f1 | sort -u)"
          topCount="$(echo "$topLevel" | grep -c .)"
          if [ "$topCount" -ne 1 ]; then
            echo "release.yml: ZIP hat nicht genau einen obersten Ordner (gefunden: $topCount):" >&2
            echo "$topLevel" >&2
            exit 1
          fi

      - name: Pruefsumme schreiben
        shell: pwsh
        run: |
          # Format von "sha256sum" ("<hash>  <dateiname>", zwei Leerzeichen: Trennzeichen plus
          # Textmodus-Marker) - UpdateCheck.shaFromAsset liest das Release-Asset SHA256SUMS genau so.
          #
          # Ablage NEBEN dem ZIP (in $ZIEL), nicht in $RUNNER_TEMP darueber: upload-artifact nimmt den
          # gemeinsamen Wurzelordner ALLER angehaengten Pfade als Artefakt-Wurzel. Lag die Pruefsumme
          # eine Ebene hoeher, war das $RUNNER_TEMP - und das ZIP trug im Artefakt den Zwischenordner
          # "paket/", die Pruefsumme dagegen nicht. Beim Release (gh release create) war das nie ein
          # Problem, dort haengen beide Dateien einzeln; nur der Probelauf sah unnoetig verschachtelt aus.
          $hash = (Get-FileHash -Algorithm SHA256 -Path $env:ZIP_PATH).Hash.ToLower()
          $shaPath = Join-Path $env:ZIEL 'SHA256SUMS'
          "$hash  $env:ZIP_NAME" | Out-File -FilePath $shaPath -Encoding ascii
          echo "SHA_PATH=$shaPath" >> $env:GITHUB_ENV
          echo "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Probelauf - ZIP und Pruefsumme nur als Workflow-Artefakt anhaengen
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SHA_PATH }}
          retention-days: 14

      - name: Freigabetext schreiben (Pruefsumme auch als Text-Rueckfall, siehe UpdateCheck.shaFromBody)
        if: github.event_name != 'workflow_dispatch'
        run: |
          # Review-Befund, Punkt 10: die Release-Seite nannte bisher nur die Pruefsumme - wer das ZIP
          # von den Assets herunterlaedt, landet nicht zwangslaeufig vorher im README. GPLv3 verlangt
          # fuer eine weitergegebene gebaute Fassung Lizenztext, Quelltext-Zugriff UND kenntlich gemachte
          # Aenderungen (Pflicht, nicht Kuer, siehe LICENSE/forge/MODIFICATIONS.md) - Quelltext und Fork
          # gehoeren deshalb HIERHER, nicht nur ins README. Die SmartScreen-Zeilen ebenfalls, aus
          # demselben Grund (unsignierte .exe, siehe README "Herunterladen und starten").
          forgeCommit="$(git -C forge rev-parse HEAD)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          SHA-256 von \`$ZIP_NAME\` (liegt auch als eigenes Anhaengsel \`SHA256SUMS\` bei):

          \`$SHA256  $ZIP_NAME\`

          Windows warnt beim allerersten Start mit "Der Computer wurde durch Windows geschuetzt"
          (SmartScreen, weil die \`.exe\` nicht signiert ist). Auf "Weitere Informationen" klicken, dann
          "Trotzdem ausfuehren" - das erscheint nur beim ersten Start dieser Fassung.

          ## Quelltext und Lizenz

          MTG-Player ist freie Software unter der GNU General Public License v3 (GPLv3) - der volle
          Lizenztext liegt als \`LICENSE\` bei diesem Release UND im Repository:
          - Quelltext dieser Fassung (Tag \`${{ github.ref_name }}\`): <https://github.com/Haste-MC/MTG-Player/tree/${{ github.ref_name }}>
          - Die Engine ist ein **veraenderter** Forge: Fork [Haste-MC/forge](https://github.com/Haste-MC/forge),
            Branch \`mtg-player\`, Submodul-Commit \`$forgeCommit\` fuer genau dieses Release. Was gegenueber
            dem Original anders ist: \`forge/MODIFICATIONS.md\` im Quelltext oben, bzw.
            <https://github.com/Haste-MC/forge/blob/mtg-player/MODIFICATIONS.md>.
          EOF
          echo "NOTES_PATH=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Release anlegen und ZIP + Pruefsumme anhaengen
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "$ZIP_PATH" "$SHA_PATH" \
            --title "MTG-Player ${{ steps.version.outputs.value }}" \
            --notes-file "$NOTES_PATH"
